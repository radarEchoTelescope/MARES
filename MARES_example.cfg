#----------------------------
# Example Configuration File for MARES
#---------------------------
#

/*
    
    "MARES_test_case"

*/ 

#name? run_name?
name = "MARES_test_case";

// path_out = "./" ;

/* All doubles require explicit double format (0.0) */

cascade:(
    {
        /* Parameters of the neutrino event */

        // Energy [GeV];
        energy = 1E7;
        // Vertex position [m];
        position = { 
            x = 0.0;
            y = 0.0;
            z = 0.0;
        };
        // Vertex direction, in spherical coordinates;
        // Angles given in degrees
        direction = {
            zenith = 90.0;
            azimuth = 90.0;
        };

        // (int) Number of primaries in the cascade
        primaries = 1;

        /* Parameters used to identify the neutrino event */
        
        // Primary identifier for this particular event
        nu_id = 16;

        // Track id, to identify groups of neutrino events.
        track_id = 0;
        
        // Particle type 
        p_id = 12;
        /* Follows PDG numbering, see
        https://pdg.lbl.gov/2007/reviews/montecarlorpp.pdf

        nu_e    = 12
        nu_mu   = 14
        nu_tau  = 16
        */

        // Type and subtype of interaction 
        i_type = 1;
        channel = 0;
        /*
        i_type and channels
            i_type==0 CC
                channel=0 Hadronic + EM (1)
            i_type==1 NC
                channel=0 Hadronic (2)
            i_type==2 GR
                channel=0 hadronic (3)
                channel=1 EM (4)
                channel=2 muons, no shower (5)
                channel=3 taus, no shower(6)
            i_type==3 decay
                channel=0 hadronic (7)
                channel=1 EM (8)
                channel=2 muons, no shower (9)
            i_type==4 brem
                channel=1 EM (10)
            i_type==5 pp
                channel=1 EM (11)
            i_type==6 pn
                channel=0 had (12)
        */

        // Bjorken-y
        inelasticity = 1.0;
        // One weight
        oneweight = 1.0;
    }
);

detector:{
    name = "test";

    transmitter:(
        {
        position = {    # m
            x = 0.0;      
            y = 0.0;
            z = -100.0;
        };

        polarization = {
            x = 0.0;
            y = 1.0;
            z = 0.0;
        };

        power = 1E3;        # W
        frequency = 5E7;    # Hz
        gaindB = 0.0;         
        }
    );


    receiver:(
        {
        position = {    # m
            x = -250.0;      
            y = 0.0;
            z = 0.0;
        };

        polarization = {
            x = 0.0;
            y = 1.0;
            z = 0.0;
        };
        
        power = 0.0;        # W
        frequency = 5E7;    # Hz
        gaindB = 0.0;         

        }
    );
};

// Set operation mode
set:{
    // set_cs_direction = True;
    // set_max_reflectivity = False;

    position_segments = "direction";
    // or
    // position_segments = "reflectivity";

    propagation = "const";
    // or
    // propagation = "iceraytracing";
    // or
    // propagation = "beam";

    /* "beam mode" 
    The scattering points and the antennas are in two different media.

  The interface between the media is a plane with equation Ax + By + Cz + D = 0. The refractive indices of the two media at both sides of the interface. 
  na = 1, nb =1.51 are .
    */
    interface = [1.0, 0.0, 0.0, 0.6];
    n_out   = 1;
    n_in    = 1.51;

    disable_fresnel_coeff = False;
};

save:{

// Assumed false if not present!

    scatter:{
        // Event properties
        duration          = True;
        voltage           = True; 
        // power               = True;  
        // target_cs           = True;
        // radar_cs            = True;

        // phase_time          = True;
        // rcs_time            = True;
        // voltage_time       = True;

        // Scattering elements properties
        // coordinates         = True;
        // phase               = True;
        // attenuation         = True;
        // arrival_time        = True;
        // polarization        = True;
        // directivity?
    }

    
    radial_values       = False;

// Cascade properties
    cascade:{
        // electron_number     = True;
        // electron_density    = True;
        // plasma_frequency    = True;
        // plasma_absorption   = True;
        // skin_depth          = True;
        // reflectance         = True;
        // opacity             = True;
        // transparency        = True;
    };


};

system:
{
    dL = 1; // cm
    dR = 1; // mm

    samping_ratio = 50; 

};

# What to use instead of model?
options:{

    plasma:{
        lifetime = 3;               # ns
        collsion_freq = 100;        # THz
        mass_ratio = 1;             # me/mp;
    };

    ice:{
        refractive_index = 1.51;
        density = 0.92;             # g/cm^3
        attenuation_length = 1450   # m
    };

    cascade:{
        moliere_radius = 7;         # cm
        ionization_energy = 20;     # eV
        deposition_energy = 2;      # MeV / (g/cm^2)
        critical_energy = 78.6;     # MeV
        radiation_column_denisty = 36.08;     # g/cm^2
    }; 


};


# eof

