physics:{

    resolution:{
        dL = 1.0;                    # cm
        dR = 1.0;                           # mm
        samping_ratio = 50.0; 
    };

    plasma:{
        lifetime = 10.0;               # ns
        collision_freq = 100.0;        # THz
        mass_ratio = 1.0;             # me/mp;
    };


    medium:{
        refractive_index = 1.78;
        density = 0.92;             # g/cm^3
        attenuation_length = 1450.0;   # m
    };

    cascade:{
        // THIS ONE IS NOT WORKING 
        // moliere_radius = 7.0;         # cm
